services:
  - type: web
    name: omdb-movie-explorer
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: OMDB_API_KEY
        sync: false          # set manually in Render dashboard

      - key: DATABASE_URL
        sync: false          # jdbc:postgresql://db.<ref>.supabase.co:5432/postgres?sslmode=require

      - key: DB_USER
        sync: false          # postgres (Supabase default)

      - key: DB_PASS
        sync: false          # your Supabase database password
