spring.application.name=omdb_movie_explorer

# ─────────────────────────────────────────────
# Server
# Render injects PORT automatically at runtime
# ─────────────────────────────────────────────
server.port=${PORT:8080}

# ─────────────────────────────────────────────
# OMDB API
# Set OMDB_API_KEY in Render → Environment tab
# ─────────────────────────────────────────────
omdb.api.url=https://www.omdbapi.com/
omdb.api.key=${OMDB_API_KEY}

# ─────────────────────────────────────────────
# Caching (Caffeine — in-memory)
# ─────────────────────────────────────────────
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=10m

# ─────────────────────────────────────────────
# Supabase PostgreSQL
#
# Set these in Render → Environment tab:
#   DATABASE_URL  = jdbc:postgresql://db.<ref>.supabase.co:5432/postgres?sslmode=require
#   DB_USER       = postgres
#   DB_PASS       = <your supabase password>
#
# Use port 6543 (Supabase pooler) for better connection management:
#   DATABASE_URL  = jdbc:postgresql://db.<ref>.supabase.co:6543/postgres?sslmode=require
# ─────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP — keep pool small on Render free tier (limited connections)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# ─────────────────────────────────────────────
# JPA / Hibernate
# ─────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Required for Supabase/PostgreSQL JDBC compatibility
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true